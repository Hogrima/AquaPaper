<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-src 'none'">
  <meta name="color-scheme" content="dark">
  <title data-i18n="documentTitle">AquaPaper · 살아 있는 수족관</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="aquarium" data-i18n-attr="aria-label:canvasLabel" aria-label="커서에 반응하는 물고기가 헤엄치는 수중 정원"></canvas>
  <div class="vignette" aria-hidden="true"></div>
  <div id="loading"><span class="loading-ring"></span><span data-i18n="loading">작은 수중 세계를 깨우는 중</span></div>
  <header class="chrome header">
    <div class="brand"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M5 20C13 8 25 8 31 20 25 32 13 32 5 20Z"/><path d="m31 20 6-8v16l-6-8ZM15 15c-3 3-3 7 0 10"/><circle cx="11" cy="19" r="1"/></svg><div><span class="wordmark">AQUA<span>PAPER</span></span><span class="tagline" data-i18n="tagline">나만의 작은 수중 세계</span></div></div>
    <div class="header-right"><span id="live-label" class="live"><i></i> <span id="live-text" data-i18n="liveAquarium">LIVE AQUARIUM</span></span><button id="fullscreen" class="icon-button" data-i18n-attr="title:fullscreen;aria-label:fullscreen" title="전체 화면 (F)" aria-label="전체 화면"><svg viewBox="0 0 24 24"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg></button></div>
  </header>
  <main class="chrome scene-caption"><span class="eyebrow" data-i18n="stillness">고요함의 순간</span><h1 data-i18n="title">물속의 작은 숲</h1><p data-i18n="subtitle">천천히 흐르는 빛, 자유롭게 헤엄치는 생명.</p></main>
  <div class="chrome hint" id="hint"><span class="cursor-icon">↖</span><span data-i18n="cursorHint">물고기 가까이 커서를 움직여 보세요</span></div>
  <footer class="chrome bottom">
    <div class="scene-number"><span>01</span><span class="line"></span><span id="scene-mode">FOREST STREAM</span></div>
    <div class="control-bar" role="toolbar" data-i18n-attr="aria-label:toolbar" aria-label="수족관 제어">
      <button id="pause" class="icon-button pause-button" data-i18n-attr="title:pause;aria-label:pause" title="일시정지 (Space)" aria-label="일시정지"><svg id="pause-icon" viewBox="0 0 24 24"><path d="M9 5v14M15 5v14"/></svg></button>
      <span class="separator"></span>
      <div class="population"><svg viewBox="0 0 26 20"><path d="M2 10c6-8 12-8 17 0-5 8-11 8-17 0Zm17 0 5-5v10l-5-5Z"/><circle cx="7" cy="9" r=".6"/></svg><span id="fish-label">72 마리</span></div>
      <button id="settings-toggle" class="text-button" data-i18n-attr="aria-label:settings" aria-expanded="false" aria-controls="settings"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 17h16M9 4v6m6 4v6"/></svg><span data-i18n="settings">환경 설정</span></button>
      <button id="apply" class="primary-button"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8m-4-4v4"/></svg><span data-i18n="applyWallpaper">바탕화면에 적용</span></button>
    </div>
    <div class="performance"><i></i><span id="fps">60 FPS</span><span>GPU</span></div>
  </footer>
  <aside id="settings" class="settings" data-i18n-attr="aria-label:settingsAria" aria-label="환경 설정" hidden>
    <div class="panel-header"><div><span class="eyebrow" data-i18n="makeItYours">나만의 설정</span><h2 data-i18n="myAquarium">나만의 수족관</h2></div><button id="close-settings" class="icon-button" data-i18n-attr="aria-label:closeSettings" aria-label="설정 닫기">×</button></div>
    <section id="display-section" class="display-section" data-i18n-attr="aria-label:monitorLayout" aria-label="모니터 배치" hidden>
      <div class="display-heading"><h3 data-i18n="monitorLayout">모니터 배치</h3><span id="monitor-count"></span></div>
      <div class="segmented" id="display-mode" role="group" data-i18n-attr="aria-label:displayModes" aria-label="표시 방식"><button data-value="single" data-i18n="oneDisplay" aria-pressed="true" class="selected">한 화면만</button><button data-value="span" data-i18n="spanAll" aria-pressed="false">모두 이어서</button><button data-value="separate" data-i18n="separateDisplays" aria-pressed="false">화면마다 따로</button></div>
      <p id="display-description" class="display-description"></p>
      <div class="monitor-map-wrap"><div id="monitor-map" class="monitor-map" role="group" data-i18n-attr="aria-label:monitorArrangement" aria-label="연결된 모니터의 실제 배치"></div></div>
      <div id="monitor-select-row"><label for="monitor-select" data-i18n="displayOn">표시할 화면</label><select id="monitor-select" data-i18n-attr="aria-label:displayMonitorAria" aria-label="표시할 모니터"></select></div>
      <p id="display-status" class="display-status" role="status"></p>
    </section>
    <div class="setting-group"><label data-i18n="language">언어</label><div class="segmented" id="language" role="group" data-i18n-attr="aria-label:language" aria-label="언어"><button data-value="ko" data-i18n="korean" aria-pressed="true">한국어</button><button data-value="en" data-i18n="english" aria-pressed="false">English</button></div></div>
    <div class="setting-group fish-mode-group"><label data-i18n="fishAppearance">물고기 표현</label><div class="segmented" id="fishMode" role="group" data-i18n-attr="aria-label:fishAppearance" aria-label="물고기 표현"><button data-value="classic" data-i18n="classicMode" aria-pressed="false">기존 모드</button><button data-value="tetra3d" data-i18n="tetra3d" class="selected" aria-pressed="true">3D 네온테트라</button></div><p id="fish-mode-description" class="display-description">입체적인 몸체와 지느러미 · 가속과 활주를 반복하는 군집 유영</p></div>
    <div class="setting-group"><label for="fish-count"><span data-i18n="fishCountLabel">물고기 수</span> <output id="fish-value">72 마리</output></label><input id="fish-count" type="range" min="12" max="160" step="4" value="72"><div class="range-ends"><span data-i18n="sparse">한적하게</span><span data-i18n="lush">풍성하게</span></div></div>
    <div class="setting-group"><label data-i18n="underwaterLighting">수중 조명</label><div class="segmented" id="lighting"><button data-value="day" data-i18n="daylight" class="selected" aria-pressed="true">자연광</button><button data-value="dusk" data-i18n="dusk" aria-pressed="false">노을</button><button data-value="night" data-i18n="moonlight" aria-pressed="false">달빛</button></div></div>
    <div class="setting-group"><label for="activity"><span data-i18n="swimmingSpeed">유영 속도</span> <output id="activity-value">차분하게</output></label><input id="activity" type="range" min="30" max="130" step="5" value="65"></div>
    <div class="setting-row"><div><label for="interaction" data-i18n="cursorInteraction">커서 반응</label><p data-i18n="cursorInteractionDescription">가까이 다가가면 살며시 흩어져요</p></div><label class="switch"><input id="interaction" type="checkbox" checked><span></span></label></div>
    <div class="setting-row"><div><label for="particles" data-i18n="particles">기포와 부유물</label><p data-i18n="particlesDescription">빛을 따라 느리게 떠오르는 입자</p></div><label class="switch"><input id="particles" type="checkbox" checked><span></span></label></div>
    <div class="setting-group"><label data-i18n="renderingQuality">렌더링 품질</label><div class="segmented" id="quality"><button data-value="eco" data-i18n="eco" aria-pressed="false">절전 · 30</button><button data-value="balanced" data-i18n="balanced" class="selected" aria-pressed="true">균형 · 60</button><button data-value="high" data-i18n="high" aria-pressed="false">선명 · 60</button></div></div>
    <div class="panel-footer"><span data-i18n="autosave">변경 내용은 자동으로 저장됩니다</span><button id="reset" data-i18n="reset">초기화</button></div>
  </aside>
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="error" role="alert" hidden><h2 data-i18n="errorTitle">수족관을 열지 못했어요</h2><p id="error-text"></p><button id="reload" class="primary-button" data-i18n="retry">다시 시도</button></div>
  <script src="app.js" type="module"></script>
</body>
</html>
